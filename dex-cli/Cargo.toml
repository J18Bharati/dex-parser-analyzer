# Modified by Zero (2026-11-01): dexpa-sdk and zip for `dexpa sdks` (fork M5). See NOTICE.
[package]
name = "dexpa-cli"
description = "Command-line DEX summaries and static-analysis findings"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dexpa-core = { path = "../dex-core", version = "0.1.0" }
dexpa-analysis = { path = "../dex-analysis", version = "0.1.0" }
# Fork M5: `dexpa sdks`. zip only to tell a missing AndroidManifest.xml from a broken one.
dexpa-sdk = { path = "../dex-sdk", version = "0.1.0" }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Fork M5: tests assemble APKs around the SDK fixtures.
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "dexpa"
path = "src/main.rs"
