# Modified by Zero (2026-11-01): new file (fork M3). See NOTICE.
# This project's SDK catalogue, written by hand from each SDK's public package names and
# documented manifest keys. It is not derived from Exodus data. Entries are unverified until
# they are checked against real APKs in the F-Droid evaluation (NOTES.md).
#
# Rules (enforced at load): unique ids; at least one package or meta-data key; every package
# prefix has at least two segments; packages match on package boundaries (`com.foo` matches
# `com.foo.X` and `com.foo.sub.Y`, never `com.foobar.X`); meta-data keys match exactly.
# Overlapping entries (Firebase inside Google's namespace) are intentional: all are reported.

[[sdk]]
id = "google-play-services"
name = "Google Play Services (client libraries)"
category = "platform"
packages = ["com.google.android.gms"]
meta_data_keys = ["com.google.android.gms.version"]

