# Modified by Jatin Bharati (2026-11-01): new crate (fork M2); zip for `scan` (2026-11-04); publish = false, the fork publishes no crates. See NOTICE.
[package]
name = "dexpa-sdk"
description = "Class-prefix inventory, SDK catalogue matching and version diffs over DEX files and APK manifests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The fork does not publish this crate: the name is not the fork's to take on crates.io. Because
# dexpa-cli depends on it, a `cargo publish` of dexpa-cli from this fork fails (RELEASING.md).
publish = false

[dependencies]
dexpa-core = { path = "../dex-core", version = "0.1.0" }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Only to tell a missing AndroidManifest.xml from a broken one (`scan`).
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
