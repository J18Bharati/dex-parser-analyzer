# Modified by Zero (2026-11-01): new crate (fork M2); publishable from M5. See NOTICE.
[package]
name = "dexpa-sdk"
description = "Class-prefix inventory, SDK catalogue matching and version diffs over DEX files and APK manifests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Published with the others since M5: dexpa-cli depends on it, and a published crate cannot
# depend on an unpublished one (`cargo publish --workspace` in `just release-dry-run`).

[dependencies]
dexpa-core = { path = "../dex-core", version = "0.1.0" }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
